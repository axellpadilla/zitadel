name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "patched"
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip lint/test/build and go straight to packing and publishing"
        required: false
        default: false
        type: boolean
      publish_target:
        description: "Which image(s) to publish"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - api
          - login

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint_test_build:
    uses: ./.github/workflows/lint_test_build.yml
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    permissions:
      contents: read
    with:
      node_version: "22"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      NX_CLOUD_ACCESS_TOKEN_READONLY: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

  pack:
    uses: ./.github/workflows/pack.yml
    permissions:
      contents: write
      packages: write
    if: ${{ github.event_name == 'workflow_dispatch' }}
    with:
      node_version: "22"
      semantic_version: "23.0.7"
      publish_target: ${{ inputs.publish_target || 'all' }}
      image_name_github_api: "ghcr.io/${{ github.repository_owner }}/zitadel"
      image_name_github_login: "ghcr.io/${{ github.repository_owner }}/zitadel-login"

  release:
    uses: ./.github/workflows/release.yml
    permissions:
      packages: write
      contents: write
      issues: write
      pull-requests: write
    needs:
      - lint_test_build
      - pack
    if: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      semantic_version: "23.0.7"
      publish_target: ${{ inputs.publish_target || 'all' }}
      image_name_github_api: "ghcr.io/${{ github.repository_owner }}/zitadel"
      image_name_github_login: "ghcr.io/${{ github.repository_owner }}/zitadel-login"
